<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Failboat of Hormuz</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #26364a 0%, #0b111a 55%, #05070a 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: #f4f4f4;
      overflow: hidden;
    }

    #gameWrap {
      position: relative;
      width: min(94vw, 520px);
      aspect-ratio: 9 / 14;
      border: 4px solid #111827;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
      background: #101827;
      touch-action: manipulation;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(#30445c 0%, #1c3347 45%, #0c2737 46%, #073047 100%);
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #score {
      position: absolute;
      top: 18px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 44px;
      font-weight: 900;
      color: white;
      text-shadow: 0 4px 0 #000, 0 0 16px rgba(255, 255, 255, 0.4);
    }

    #panel {
      pointer-events: auto;
      position: absolute;
      left: 24px;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      padding: 22px;
      border-radius: 18px;
      text-align: center;
      background: rgba(5, 10, 17, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
    }

    #panel.deadScreen {
      left: 10px;
      right: 10px;
      top: 10px;
      bottom: 10px;
      transform: none;
      display: grid;
      grid-template-columns: 42% 1fr;
      gap: 10px;
      align-items: stretch;
      padding: 10px;
      text-align: center;
      font-size: 0.85em;
    }

    #infoBox {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    #panel.deadScreen #infoBox {
      border-radius: 16px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.06);
    }

    #panel h1 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: -1px;
      line-height: 0.95;
    }

    #panel p {
      margin: 6px 0;
      color: #d9e4ef;
      font-size: 13px;
      line-height: 1.25;
    }

    #panel .tiny {
      color: #95a7ba;
      font-size: 12px;
    }

    #finalScore {
      font-size: 54px;
      font-weight: 900;
      margin: 4px 0 8px;
      color: #ffd166;
      text-shadow: 0 4px 0 #7a4f00, 0 0 14px rgba(255, 209, 102, 0.6);
    }

    #playerName {
      pointer-events: auto;
      user-select: text;
      width: 100%;
      margin: 12px 0 6px;
      padding: 12px 14px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      outline: none;
      background: rgba(255, 255, 255, 0.94);
      color: #101827;
    }

    #buttonLook {
      pointer-events: auto;
      display: inline-block;
      margin-top: 14px;
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      background: #ffd166;
      color: #1b1b1b;
      font: inherit;
      font-weight: 900;
      box-shadow: 0 5px 0 #9f6b00;
      cursor: pointer;
    }

    #buttonLook:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #9f6b00;
    }

    #leaderboard {
      margin-top: 16px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    #panel.deadScreen #leaderboard {
      grid-column: 1;
      grid-row: 1;
      margin-top: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    #panel.deadScreen #leaderboard ol {
      flex: 1;
      overflow: hidden;
      padding-left: 18px;
      font-size: 13px;
    }

    #leaderboard h2 {
      margin: 0 0 8px;
      font-size: 16px;
      text-align: center;
      color: #ffd166;
    }

    #leaderboard ol {
      margin: 0;
      padding-left: 24px;
      font-size: 14px;
      color: #e5edf6;
    }

    #leaderboard li {
      margin: 4px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .scoreName {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scoreValue {
      font-weight: 900;
      color: #ffffff;
    }

    #status {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      text-shadow: 0 2px 2px #000;
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <canvas id="game" width="450" height="700"></canvas>
    <audio id="bgMusic" src="Chill as a kite.mp3" loop preload="auto"></audio>
    <div id="hud">
      <div id="score">0</div>
      <div id="panel">
        <div id="leaderboard">
          <h2>Highscore Top 15</h2>
          <ol id="scoreList"></ol>
        </div>
        <div id="infoBox">
          <div id="finalScore"></div>
          <h1>Failboat of Hormuz</h1>
          <p></p>
          <p></p>
          <input id="playerName" maxlength="16" placeholder="Kapteenin nimi" autocomplete="off" />
          <button id="buttonLook" type="button">Lets fail!</button>
          <p class="tiny">Pelaa: nuoli ylös, space tai hiiren klikkaus</p>
        </div>
      </div>
      <div id="status">
        <span>FAILBOAT INDUSTRIES</span>
        <span id="best">BEST 0</span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const panel = document.getElementById("panel");
      const buttonLook = document.getElementById("buttonLook");
      const bestEl = document.getElementById("best");
      const finalScoreEl = document.getElementById("finalScore");
      const playerNameInput = document.getElementById("playerName");
      const scoreListEl = document.getElementById("scoreList");
      const bgMusic = document.getElementById("bgMusic");

      const SUPABASE_URL = "https://chbtmuyfvykllxagwlrn.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_1segRTQcaPX6AiKbt_LHUg_Y5m0Md_k";

      const W = canvas.width;
      const H = canvas.height;
      const seaLine = 315;

      const gravity = 0.36;
      const lift = -7.2;
      const obstacleSpeed = 3.6;
      const spawnEvery = 82;
      const touchDevice = window.matchMedia("(pointer: coarse)").matches;
      const deviceSpeed = touchDevice ? 1.35 : 1;

      let state = "ready";
      let frame = 0;
      let score = 0;
      let best = Number(localStorage.getItem("failboatBest") || 0);
      let playerName = localStorage.getItem("failboatPlayerName") || "";
      let highScores = [];
      let obstacles = [];
      let bubbles = [];
      let countdown = 0;
      let deathCooldown = 0;
      let spawnTimer = 0;
      let bubbleTimer = 0;
      let lastTime = performance.now();

      const ship = {
        x: 115,
        y: 330,
        w: 58,
        h: 34,
        vy: 0,
        rot: 0
      };

      playerNameInput.value = playerName;
      bestEl.textContent = `BEST ${best}`;

      function cleanName(name) {
        return (name || "Kapteeni").trim().slice(0, 16) || "Kapteeni";
      }

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderHighScores() {
        if (!highScores.length) {
          scoreListEl.innerHTML = `<li><span class="scoreName">Ei tuloksia vielä</span><span class="scoreValue">0</span></li>`;
          return;
        }

        scoreListEl.innerHTML = highScores.map(item => `
          <li>
            <span class="scoreName">${escapeHtml(item.name)}</span>
            <span class="scoreValue">${item.score}</span>
          </li>
        `).join("");
      }

      async function fetchGlobalScores() {
        try {
          const res = await fetch(
            `${SUPABASE_URL}/rest/v1/scores?select=name,score,created_at&order=score.desc&order=created_at.asc&limit=15`,
            {
              headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`
              }
            }
          );

          if (!res.ok) throw new Error(`Scorejen haku epäonnistui: ${res.status}`);
          highScores = await res.json();
          renderHighScores();
        } catch (err) {
          console.warn(err);
          renderHighScores();
        }
      }

      async function submitGlobalScore(name, points) {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/submit_score`, {
            method: "POST",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              p_name: cleanName(name),
              p_score: points
            })
          });

          if (!res.ok) throw new Error(`Scoren lähetys epäonnistui: ${res.status}`);
          await fetchGlobalScores();
        } catch (err) {
          console.warn(err);
        }
      }

      function setPanelForStart() {
        panel.classList.remove("deadScreen");
        panel.style.display = "block";
        playerNameInput.style.display = "block";
        finalScoreEl.textContent = "";
        panel.querySelector("h1").innerHTML = "Failboat<br>of Hormuz";
        panel.querySelectorAll("p")[0].textContent = "Captain of Failboat!";
        panel.querySelectorAll("p")[1].textContent = "Ahoy! Hoida hommas.";
        buttonLook.textContent = "Lets fail!";
      }

      function resetGame() {
        playerName = cleanName(playerNameInput.value);
        localStorage.setItem("failboatPlayerName", playerName);

        state = "countdown";
        countdown = 180;
        deathCooldown = 0;
        spawnTimer = 8;
        bubbleTimer = 0;
        frame = 0;
        score = 0;
        obstacles = [];
        bubbles = [];
        ship.y = 330;
        ship.vy = 0;
        ship.rot = 0;
        scoreEl.textContent = "0";
        finalScoreEl.textContent = "";
        panel.style.display = "none";
        playerNameInput.style.display = "none";
        lastTime = performance.now();
      }

      function startGame() {
        if (state === "playing" || state === "countdown") return;
        if (state === "dead" && deathCooldown > 0) return;

        bgMusic.volume = 0.3;
        bgMusic.currentTime = 0;
        bgMusic.play().catch(() => {});

        resetGame();
      }

      function flap() {
        if (state === "playing") ship.vy = lift;
      }

      function handleAction() {
        if (state === "ready" || state === "dead") startGame();
        else if (state === "playing") flap();
      }

      buttonLook.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        startGame();
      });

      buttonLook.addEventListener("touchstart", event => {
        event.preventDefault();
        event.stopPropagation();
        startGame();
      }, { passive: false });

      playerNameInput.addEventListener("click", event => {
        event.stopPropagation();
        playerNameInput.focus();
      });

      playerNameInput.addEventListener("touchstart", event => {
        event.stopPropagation();
        playerNameInput.focus();
      }, { passive: true });

      playerNameInput.addEventListener("keydown", event => {
        event.stopPropagation();
        if (event.code === "Enter") {
          event.preventDefault();
          playerNameInput.blur();
          startGame();
        }
      });

      canvas.addEventListener("pointerdown", () => {
        if (document.activeElement === playerNameInput) return;
        handleAction();
      });

      window.addEventListener("keydown", event => {
        if (document.activeElement === playerNameInput) return;
        if (event.code === "Space" || event.code === "ArrowUp") {
          event.preventDefault();
          handleAction();
        }
      });

      function spawnObstacle() {
        const gap = 174;
        const safeTop = 125;
        const safeBottom = H - 155;
        const gapY = safeTop + Math.random() * (safeBottom - safeTop - gap);
        obstacles.push({
          x: W + 40,
          w: 72,
          gapY,
          gap,
          scored: false,
          wobble: Math.random() * Math.PI * 2
        });
      }

      function makeBubbles(dt) {
        bubbleTimer -= dt;
        if (bubbleTimer > 0) return;
        bubbleTimer = 7;
        bubbles.push({
          x: ship.x - 18,
          y: ship.y + 20 + Math.random() * 14,
          r: 2 + Math.random() * 3,
          vx: -1.2 - Math.random(),
          vy: -0.2 + Math.random() * 0.4,
          life: 45
        });
      }

      function update(dt) {
        if (state === "dead") {
          if (deathCooldown > 0) {
            deathCooldown -= dt;
            buttonLook.textContent = "ODOTA...";
          } else {
            buttonLook.textContent = "Fail again?";
          }
          return;
        }

        if (state === "countdown") {
          countdown -= dt;
          ship.rot = Math.sin(frame * 0.05) * 0.05;
          if (countdown <= 0) {
            state = "playing";
            ship.vy = 0;
            spawnTimer = 8;
          }
          return;
        }

        if (state !== "playing") return;

        ship.vy += gravity * dt;
        ship.y += ship.vy * dt;
        ship.rot = Math.max(-0.55, Math.min(0.72, ship.vy / 12));

        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnObstacle();
          spawnTimer += spawnEvery;
        }

        makeBubbles(dt);

        obstacles.forEach(o => {
          o.x -= obstacleSpeed * dt;
          o.wobble += 0.045 * dt;
          if (!o.scored && o.x + o.w < ship.x) {
            o.scored = true;
            score++;
            scoreEl.textContent = score;
          }
        });

        obstacles = obstacles.filter(o => o.x + o.w > -60);

        bubbles.forEach(b => {
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.life -= dt;
        });
        bubbles = bubbles.filter(b => b.life > 0);

        if (ship.y < 22 || ship.y + ship.h > H - 42) die();

        for (const o of obstacles) {
          const inX = ship.x + ship.w * 0.55 > o.x && ship.x + ship.w * 0.45 < o.x + o.w;
          const hitTop = ship.y + 18 < o.gapY;
          const hitBottom = ship.y + ship.h - 18 > o.gapY + o.gap;
          if (inX && (hitTop || hitBottom)) die();
        }
      }

      function die() {
        if (state === "dead") return;
        bgMusic.pause();
        state = "dead";
        deathCooldown = 180;
        submitGlobalScore(playerName, score);
        best = Math.max(best, score);
        localStorage.setItem("failboatBest", best);
        bestEl.textContent = `BEST ${best}`;
        panel.classList.add("deadScreen");
        panel.style.display = "grid";
        playerNameInput.style.display = "block";
        finalScoreEl.textContent = score;
        panel.querySelector("h1").innerHTML = "FAILBOAT<br>UPPOSI";
        panel.querySelectorAll("p")[0].textContent = "Hormuzin vakuutuslautakunta pyörittää silmiään.";
        panel.querySelectorAll("p")[1].textContent = "Yritä uudelleen. Tällä kertaa vähemmän rautaa kylkeen.";
        buttonLook.textContent = "ODOTA...";
      }

      function drawBackground() {
        ctx.clearRect(0, 0, W, H);

        const sky = ctx.createLinearGradient(0, 0, 0, seaLine);
        sky.addColorStop(0, "#344b65");
        sky.addColorStop(1, "#152635");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, seaLine);

        ctx.fillStyle = "rgba(255,255,255,0.08)";
        for (let i = 0; i < 9; i++) {
          const x = (i * 83 - frame * 0.18) % (W + 100) - 50;
          const y = 48 + (i * 31) % 170;
          ctx.beginPath();
          ctx.ellipse(x, y, 34, 9, 0, 0, Math.PI * 2);
          ctx.ellipse(x + 28, y + 3, 25, 7, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = "#062b42";
        ctx.fillRect(0, seaLine, W, H - seaLine);

        ctx.strokeStyle = "rgba(255,255,255,0.18)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 12) {
          const y = seaLine + Math.sin((x + frame * 2) * 0.035) * 7;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.lineWidth = 2;
        for (let y = seaLine + 45; y < H; y += 52) {
          ctx.beginPath();
          for (let x = 0; x <= W; x += 18) {
            const yy = y + Math.sin((x + frame) * 0.025) * 4;
            if (x === 0) ctx.moveTo(x, yy);
            else ctx.lineTo(x, yy);
          }
          ctx.stroke();
        }
      }

      function drawShip() {
        ctx.save();
        ctx.translate(ship.x + ship.w / 2, ship.y + ship.h / 2);
        ctx.rotate(ship.rot);

        ctx.fillStyle = "#d9dde2";
        ctx.beginPath();
        ctx.moveTo(-29, 5);
        ctx.lineTo(15, 5);
        ctx.lineTo(30, -5);
        ctx.lineTo(-20, -9);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#56616d";
        ctx.fillRect(-13, -22, 25, 14);
        ctx.fillStyle = "#9ee7ff";
        ctx.fillRect(-8, -19, 8, 5);
        ctx.fillRect(3, -19, 8, 5);
        ctx.fillStyle = "#c53030";
        ctx.fillRect(-27, 3, 48, 5);
        ctx.fillStyle = "#171923";
        ctx.fillRect(-6, -34, 5, 12);
        ctx.fillStyle = "#ffd166";
        ctx.beginPath();
        ctx.arc(23, 1, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawMine(x, y, r, wobble) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(wobble);
        ctx.strokeStyle = "#0b0f14";
        ctx.lineWidth = 5;
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.75);
          ctx.lineTo(Math.cos(a) * r * 1.35, Math.sin(a) * r * 1.35);
          ctx.stroke();
        }
        ctx.fillStyle = "#141b24";
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#2b3a4b";
        ctx.beginPath();
        ctx.arc(-5, -6, r * 0.28, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawRocket(x, y, h, wobble) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(wobble) * 0.045);

        // Missile hanging from the sky, nose pointing DOWN toward the ship.
        const bodyTop = 18;
        const bodyBottom = Math.max(70, h - 26);
        const bodyHeight = bodyBottom - bodyTop;

        // warning cable / trail from top edge
        ctx.strokeStyle = "rgba(255, 255, 255, 0.18)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, bodyTop);
        ctx.stroke();

        // flame / exhaust at the top
        ctx.fillStyle = "rgba(255, 209, 102, 0.85)";
        ctx.beginPath();
        ctx.moveTo(-8, bodyTop);
        ctx.lineTo(0, bodyTop - 22 - Math.sin(frame * 0.25) * 5);
        ctx.lineTo(8, bodyTop);
        ctx.closePath();
        ctx.fill();

        // missile body
        ctx.fillStyle = "#e5e7eb";
        ctx.fillRect(-14, bodyTop, 28, bodyHeight);

        // red danger stripe
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(-14, bodyTop + bodyHeight * 0.45, 28, 10);

        // fins near the top/rear
        ctx.fillStyle = "#6b7280";
        ctx.beginPath();
        ctx.moveTo(-14, bodyTop + 12);
        ctx.lineTo(-30, bodyTop + 2);
        ctx.lineTo(-14, bodyTop + 34);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(14, bodyTop + 12);
        ctx.lineTo(30, bodyTop + 2);
        ctx.lineTo(14, bodyTop + 34);
        ctx.closePath();
        ctx.fill();

        // cockpit / sensor dot
        ctx.fillStyle = "#60a5fa";
        ctx.beginPath();
        ctx.arc(0, bodyTop + bodyHeight * 0.38, 6, 0, Math.PI * 2);
        ctx.fill();

        // nose cone pointing downward
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.moveTo(-17, bodyBottom);
        ctx.lineTo(17, bodyBottom);
        ctx.lineTo(0, bodyBottom + 28);
        ctx.closePath();
        ctx.fill();

        // small shadow under nose
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.beginPath();
        ctx.ellipse(0, bodyBottom + 30, 16, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawObstacles() {
        for (const o of obstacles) {
          drawRocket(o.x + o.w / 2, 0, o.gapY - 12, o.wobble);

          const mineStart = o.gapY + o.gap;
          ctx.strokeStyle = "rgba(10, 15, 20, 0.7)";
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(o.x + o.w / 2, H);
          ctx.lineTo(o.x + o.w / 2, mineStart + 38);
          ctx.stroke();

          for (let y = H - 24; y > mineStart + 24; y -= 48) {
            drawMine(o.x + o.w / 2, y, 17, o.wobble + y * 0.01);
          }
        }
      }

      function drawBubbles() {
        ctx.fillStyle = "rgba(180, 230, 255, 0.5)";
        for (const b of bubbles) {
          ctx.globalAlpha = Math.max(0, b.life / 45);
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawReadyFloat() {
        if (state !== "ready") return;
        ship.y = 330 + Math.sin(frame * 0.045) * 8;
        ship.rot = Math.sin(frame * 0.03) * 0.07;
      }

      function drawLeaderboardSide() {
        if (state !== "playing") return;
        const w = 140;
        const h = 430;
        const x = 10;
        const y = H - h - 10;
        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "#ffd166";
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "center";
        ctx.fillText("TOP 15", x + w / 2, y + 16);
        ctx.textAlign = "left";
        ctx.font = "12px Arial";
        ctx.fillStyle = "#ffffff";
        highScores.slice(0, 15).forEach((s, i) => {
          const yy = y + 34 + i * 24;
          const name = s.name.length > 10 ? s.name.slice(0, 10) + "…" : s.name;
          ctx.fillText(`${i + 1}. ${name}`, x + 8, yy);
          ctx.textAlign = "right";
          ctx.fillText(s.score, x + w - 8, yy);
          ctx.textAlign = "left";
        });
        ctx.restore();
      }

      function drawCountdown() {
        if (state !== "countdown") return;
        const seconds = Math.ceil(countdown / 60);
        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#ffd166";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "bold 110px Arial";
        ctx.fillText(seconds > 0 ? seconds : "GO", W / 2, H / 2 - 40);
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(W / 2, H / 2 + 40);
        ctx.lineTo(W / 2 - 30, H / 2 + 90);
        ctx.lineTo(W / 2 + 30, H / 2 + 90);
        ctx.closePath();
        ctx.fill();
        ctx.font = "bold 22px Arial";
        ctx.fillText("Pelaa: nuoli ylös, hiiri tai space", W / 2, H / 2 + 140);
        ctx.restore();
      }

      function loop(now) {
        const elapsed = now - lastTime;
        lastTime = now;

        let dt = elapsed / 16.6667;
        dt = Math.min(dt, 1.5);
        dt *= deviceSpeed;

        frame += dt;
        drawReadyFloat();
        update(dt);
        drawBackground();
        drawObstacles();
        drawBubbles();
        drawShip();
        drawCountdown();
        requestAnimationFrame(loop);
      }

      renderHighScores();
      fetchGlobalScores();
      setInterval(fetchGlobalScores, 15000);
      setPanelForStart();
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
